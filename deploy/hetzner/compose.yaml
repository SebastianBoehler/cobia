name: cobia-production

services:
  cert-init:
    image: postgres:16-alpine
    entrypoint: ["sh", "/scripts/sync-postgres-cert.sh", "init"]
    environment:
      COBIA_API_DOMAIN: ${COBIA_API_DOMAIN}
    volumes:
      - ./sync-postgres-cert.sh:/scripts/sync-postgres-cert.sh:ro
      - caddy-data:/caddy:ro
      - postgres-tls:/tls
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 32

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cobia
      POSTGRES_USER: cobia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - password_encryption=scram-sha-256
    depends_on:
      cert-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cobia -d cobia"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro
    ports:
      - "15432:5432"
    cpus: 0.75
    mem_limit: 512m
    pids_limit: 128

  cert-sync:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/sync-postgres-cert.sh", "watch"]
    environment:
      COBIA_API_DOMAIN: ${COBIA_API_DOMAIN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sync-postgres-cert.sh:/scripts/sync-postgres-cert.sh:ro
      - caddy-data:/caddy:ro
      - postgres-tls:/tls
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 32

  migrate:
    build:
      context: ../..
      dockerfile: deploy/hetzner/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://cobia:${POSTGRES_PASSWORD}@db:5432/cobia
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128

  replay:
    build:
      context: ../..
      dockerfile: deploy/hetzner/Dockerfile.replay
    init: true
    restart: unless-stopped
    environment:
      REPLAY_SERVICE_SECRET: ${REPLAY_SERVICE_SECRET}
      REPLAY_MAX_CONCURRENCY: 1
      XLAYER_RPC_URL: ${XLAYER_RPC_URL}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
      BASE_RPC_URL: ${BASE_RPC_URL}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    cpus: 1.25
    mem_limit: 768m
    pids_limit: 256

  solver:
    build:
      context: ../..
      dockerfile: examples/open-solver/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      CODEX_HOME: /auth/codex
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      COBIA_MODEL: ${COBIA_MODEL}
      REFERENCE_SOLVER_PRIVATE_KEY: ${REFERENCE_SOLVER_PRIVATE_KEY}
      OKX_API_KEY: ${OKX_API_KEY}
      OKX_SECRET_KEY: ${OKX_SECRET_KEY}
      OKX_PASSPHRASE: ${OKX_PASSPHRASE}
      COBIA_EXECUTOR_V3_ADDRESS: ${COBIA_EXECUTOR_V3_ADDRESS}
      XLAYER_RPC_URL: ${XLAYER_RPC_URL}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL}
    volumes:
      - codex-auth:/auth/codex
      - ./config.production.toml:/auth/codex/config.toml:ro
      - solver-state:/var/lib/cobia-solver
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').stat('/var/lib/cobia-solver/heartbeat',(error,stat)=>{if(error||Date.now()-stat.mtimeMs>180000)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    cpus: 1.5
    mem_limit: 1280m
    pids_limit: 256

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      COBIA_API_DOMAIN: ${COBIA_API_DOMAIN}
    depends_on:
      replay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64

volumes:
  postgres-data:
  postgres-tls:
  caddy-data:
  caddy-config:
  codex-auth:
  solver-state:
