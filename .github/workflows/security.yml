name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - run: pnpm audit --prod --audit-level high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  containers:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: replay
            dockerfile: deploy/hetzner/Dockerfile.replay
          - name: solver
            dockerfile: examples/open-solver/Dockerfile
          - name: migrate
            dockerfile: deploy/hetzner/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --file ${{ matrix.dockerfile }} --tag cobia/${{ matrix.name }}:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cobia/${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
