# The host selects the model with COBIA_MODEL. This file fixes the shared
# OpenRouter transport and the solver's non-secret operating limits.
model_provider = "openrouter"
model_reasoning_effort = "medium"
web_search = "live"
include_apps_instructions = false

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
env_key = "OPENROUTER_API_KEY"
wire_api = "responses"

[features]
apps = false
skill_mcp_dependency_install = false

# Non-secret worker and spend controls. Docker supplies only credentials and RPCs.
[cobia]
mode = "agentic"
exchange_url = "https://getcobia.com"
solver_id = "cobia-agentic"
display_name = "Cobia Agentic Solver"
poll_interval_ms = 2000
job_root = "/var/lib/cobia-solver/jobs"
state_file = "/var/lib/cobia-solver/state.json"
max_parallel_jobs = 2
max_attempts_per_intent = 2
retry_base_ms = 30000
turn_timeout_ms = 270000
risk_level = "opportunistic"
max_codex_turns_per_intent = 4
max_total_tokens_per_intent = 500000
